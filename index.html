<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero AI Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #343541; display: flex; justify-content: center; align-items: center; height: 100vh; color: #ececf1; }
        .chat-container { width: 100%; max-width: 700px; height: 90vh; background: #202123; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .chat-header { background: #343541; padding: 18px; text-align: center; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #4d4d4f; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 85%; line-height: 1.5; font-size: 0.95rem; word-wrap: break-word; }
        .user-message { background: #0b93f6; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-message { background: #444654; color: #d1d5db; align-self: flex-start; border-bottom-left-radius: 2px; }
        .input-box { display: flex; padding: 15px; background: #343541; border-top: 1px solid #4d4d4f; }
        input { flex: 1; padding: 12px; border: 1px solid #565869; background: #40414f; color: white; border-radius: 6px; outline: none; font-size: 1rem; }
        input::placeholder { color: #8e8ea0; }
        button { padding: 12px 20px; margin-left: 10px; background: #19c37d; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #1a7f5a; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🤖 Hero AI Assistant</div>
    <div class="chat-box" id="chatBox">
        <div class="message bot-message">नमस्ते! मैं आपका पर्सनल AI असिस्टेंट हूँ। आप मुझसे कुछ भी पूछ सकते हैं!</div>
    </div>
    <div class="input-box">
        <input type="text" id="userInput" placeholder="यहाँ अपना सवाल लिखें..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // अपनी AIzaSy... वाली Google AI Studio की सही API Key यहाँ डालें
    const API_KEY = "AIzaSy_आपकी_सही_API_KEY_यहाँ";

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const message = input.value.trim();

        if (!message) return;

        // User Message Show करना
        chatBox.innerHTML += `<div class="message user-message">${escapeHtml(message)}</div>`;
        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        // Bot Thinking Message
        const botMsgDiv = document.createElement("div");
        botMsgDiv.className = "message bot-message";
        botMsgDiv.innerText = "सोच रहा हूँ...";
        chatBox.appendChild(botMsgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: message }] }]
                })
            });

            const data = await response.json();
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                botMsgDiv.innerText = data.candidates[0].content.parts[0].text;
            } else {
                botMsgDiv.innerText = "Error: API Key या Response में समस्या है।";
            }
        } catch (error) {
            botMsgDiv.innerText = "Error: सर्वर से कनेक्ट नहीं हो सका।";
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
